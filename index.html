<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anne Dinlenme Oyunu 🎮🌸</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        h1 { color: #fb6f92; margin: 5px 0; font-size: 1.5rem; text-align: center; }
        .Skor-Alani {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff477e;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #ffb3c6;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #OyunAlani {
            width: 100%;
            max-width: 360px;
            height: 55vh;
            background-color: white;
            border: 3px solid #ff8fab;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(251, 111, 146, 0.2);
        }
        #Sepet {
            width: 80px;
            height: 45px;
            background-color: #ff8fab;
            border-radius: 10px 10px 20px 20px;
            position: absolute;
            bottom: 10px;
            left: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: left 0.1s ease-out, background-color 0.1s;
        }
        .Obje {
            position: absolute;
            font-size: 2.2rem;
            top: -50px;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Mobil Butonlar Alanı */
        .Buton-Alani {
            display: flex;
            gap: 30px;
            margin-top: 15px;
            width: 100%;
            max-width: 360px;
            justify-content: center;
        }
        .Yon-Buton {
            background-color: #ff8fab;
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 15px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            active: transform: scale(0.95);
        }
        .Yon-Buton:active {
            background-color: #ff477e;
            transform: scale(0.95);
        }
        /* Kazandın Ekranı */
        .Bitis-Ekrani {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(251, 111, 146, 0.95);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            font-size: 1.5rem;
            font-weight: bold;
            animation: belirme 0.5s ease-out;
        }
        @keyframes belirme { from { opacity: 0; } to { opacity: 1; } }
        .Yeniden-Buton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            background: white;
            color: #ff477e;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Anne Dinlenme Oyunu 🎮</h1>
    <p style="color: #6c757d; margin: 0 0 10px 0; font-size: 0.9rem; text-align: center;">Aşağıdaki butonlarla sepeti yönet! 50 puana ulaş!</p>

    <div class="Skor-Alani">Puan: <span id="Skor">0</span></div>

    <div id="OyunAlani">
        <div id="Sepet">🧺</div>
        
        <div id="BitisEkrani" class="Bitis-Ekrani">
            🎉 BUGÜN DİNLENMEYİ HAKETTİN ANNEM ❤️
            <br><br>
            <span style="font-size: 1rem; font-weight: normal;">Harika bir skora ulaştın!</span>
            <button class="Yeniden-Buton" onclick="OyunuSifirla()">Yeniden Oyna</button>
        </div>
    </div>

    <!-- Yeni Eklenen Dokunmatik Butonlar -->
    <div class="Buton-Alani">
        <button class="Yon-Buton" ontouchstart="ButonlaHareket(-1)" onclick="ButonlaHareket(-1)">◀</button>
        <button class="Yon-Buton" ontouchstart="ButonlaHareket(1)" onclick="ButonlaHareket(1)">▶</button>
    </div>

<script>
    const oyunAlani = document.getElementById('OyunAlani');
    const sepet = document.getElementById('Sepet');
    const skorTablosu = document.getElementById('Skor');
    const bitisEkrani = document.getElementById('BitisEkrani');

    let skor = 0;
    let sepetX = 140;
    let oyunAktif = true;
    const sepetGenisligi = 80;
    const adimMiktari = 35; // Her basışta kaç piksel kaysın

    const objeler = [
        { ikon: '☕', puan: 10 }, 
        { ikon: '😴', puan: 15 }, 
        { ikon: '💆', puan: 10 }, 
        { ikon: '👔', puan: -5 },  
        { ikon: '🍽️', puan: -10 }, 
        { ikon: '🧺', puan: -5 }   
    ];

    // Butonla Hareket Etme Fonksiyonu (Hem bilgisayar hem mobil için)
    function ButonlaHareket(yon) {
        if (!oyunAktif) return;
        const alanGenisligi = oyunAlani.clientWidth;
        
        sepetX += yon * adimMiktari;
        
        // Sınır kontrolü
        if (sepetX < 0) sepetX = 0;
        if (sepetX > (alanGenisligi - sepetGenisligi)) sepetX = alanGenisligi - sepetGenisligi;
        
        sepet.style.left = sepetX + 'px';
    }

    // Klavye Kontrolü (Bilgisayar için yedek)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') ButonlaHareket(-1);
        if (e.key === 'ArrowRight') ButonlaHareket(1);
    });

    function ObjeOlustur() {
        if (!oyunAktif) return;

        const alanGenisligi = oyunAlani.clientWidth;
        const secilenObje = objeler[Math.floor(Math.random() * objeler.length)];
        const objeElement = document.createElement('div');
        objeElement.classList.add('Obje');
        objeElement.innerText = secilenObje.ikon;
        
        const rastgeleX = Math.random() * (alanGenisligi - 40);
        objeElement.style.left = rastgeleX + 'px';
        oyunAlani.appendChild(objeElement);

        let objeY = -50;
        const dusmeHizi = Math.random() * 2 + 3; 

        function Dusur() {
            if (!oyunAktif) {
                objeElement.remove();
                return;
            }

            objeY += dusmeHizi;
            objeElement.style.top = objeY + 'px';

            // Garanti Çarpışma Testi (Yakalama alanı dikeyde genişletildi)
            const sepetUst = oyunAlani.clientHeight - 65;
            if (objeY >= sepetUst && objeY <= sepetUst + 35) {
                const objeSol = parseFloat(objeElement.style.left);
                
                if (objeSol + 40 >= sepetX && objeSol <= sepetX + sepetGenisligi) {
                    skor += secilenObje.puan;
                    if (skor < 0) skor = 0; 
                    skorTablosu.innerText = skor;
                    
                    sepet.style.backgroundColor = secilenObje.puan > 0 ? '#4caf50' : '#f44336';
                    setTimeout(() => sepet.style.backgroundColor = '#ff8fab', 150);

                    objeElement.remove();
                    PuanKontrol();
                    return;
                }
            }

            if (objeY > oyunAlani.clientHeight) {
                objeElement.remove();
            } else {
                requestAnimationFrame(Dusur);
            }
        }
        requestAnimationFrame(Dusur);
    }

    function PuanKontrol() {
        if (skor >= 50) {
            oyunAktif = false;
            bitisEkrani.style.display = 'flex';
        }
    }

    function OyunuSifirla() {
        skor = 0;
        skorTablosu.innerText = skor;
        bitisEkrani.style.display = 'none';
        document.querySelectorAll('.Obje').forEach(e => e.remove());
        oyunAktif = true;
    }

    setInterval(ObjeOlustur, 1200);
</script>

</body>
</html>
