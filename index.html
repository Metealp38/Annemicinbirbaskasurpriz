<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annemin Dinlenme Kuponları 💖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .Konteyner {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(251, 111, 146, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 2px solid #ffb3c6;
            box-sizing: border-box;
        }
        h1 { color: #fb6f92; margin-bottom: 5px; font-size: 1.6rem; }
        .Skor-Tabelasi {
            background-color: #fff0f3;
            border: 2px dashed #ff8fab;
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.4rem;
            font-weight: bold;
            color: #fb6f92;
        }
        #Puan { font-size: 2rem; color: #ff477e; }
        .Kupon-Listesi {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .Kupon-Buton {
            background-color: #ffe5ec;
            border: 2px solid #ff8fab;
            border-radius: 15px;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: bold;
            color: #fb6f92;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .Kupon-Buton:hover:not(:disabled) {
            transform: scale(1.02);
            background-color: #ffc2d1;
            color: white;
        }
        .Kupon-Buton:disabled {
            background-color: #e0e0e0;
            border-color: #b0b0b0;
            color: #757575;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .Nadir-Buton {
            border: 2px solid #ff477e;
            background-color: #fff0f3;
            color: #ff477e;
            position: relative;
        }
        .Nadir-Buton:not(:disabled) {
            animation: parıldama 1s infinite alternate;
        }
        @keyframes parıldama {
            from { box-shadow: 0 0 5px #ff477e; }
            to { box-shadow: 0 0 15px #ff477e; }
        }
        .Puan-Etiketi {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        .Arti-Puan { background-color: #d4edda; color: #155724; }
        .Eksi-Puan { background-color: #f8d7da; color: #721c24; }
        
        /* Kazandın Tebrik Ekranı */
        .Tebrik-Alani {
            display: none;
            margin-top: 20px;
            background: linear-gradient(135deg, #ff477e, #ff7096);
            color: white;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            animation: kutlama 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        @keyframes kutlama {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="Konteyner">
    <h1>Annenin Dinlenme Paneli 🌸</h1>
    <p style="color: #6c757d; margin: 0;">Kuponları kullan, puanları topla!</p>

    <div class="Skor-Tabelasi">
        Mevcut Puanın: <br>
        <span id="Puan">0</span>
    </div>

    <div class="Kupon-Listesi">
        <!-- Normal Butonlar -->
        <button class="Kupon-Buton" onclick="PuanDegistir(15)">
            ☕ KAHVE KEYFİ <span class="Puan-Etiketi Arti-Puan">+15</span>
        </button>
        <button class="Kupon-Buton" onclick="PuanDegistir(10)">
            💆 20 DAKİKA MASAJ <span class="Puan-Etiketi Arti-Puan">+10</span>
        </button>
        <button class="Kupon-Buton" onclick="PuanDegistir(-10)">
            🧺 ÇAMAŞIRLARI TOPLA <span class="Puan-Etiketi Eksi-Puan">-10</span>
        </button>
        <button class="Kupon-Buton" onclick="PuanDegistir(-5)">
            👔 ÜTÜ YAP <span class="Puan-Etiketi Eksi-Puan">-5</span>
        </button>
        <button class="Kupon-Buton" onclick="PuanDegistir(-15)">
            🍽️ BULAŞIKLARI YIKA <span class="Puan-Etiketi Eksi-Puan">-15</span>
        </button>
        <button class="Kupon-Buton" onclick="PuanDegistir(20)">
            😴 30 DAKİKA UYKU <span class="Puan-Etiketi Arti-Puan">+20</span>
        </button>

        <!-- Nadir Butonlar (Başlangıçta Kilitli) -->
        <button id="Nadir1" class="Kupon-Buton Nadir-Buton" onclick="PuanDegistir(40)" disabled>
            🔒 SENI COK SEVIYORUZ ANNEM <span class="Puan-Etiketi Arti-Puan">+40</span>
        </button>
        <button id="Nadir2" class="Kupon-Buton Nadir-Buton" onclick="PuanDegistir(50)" disabled>
            🔒 DÜNYANIN EN İYİ ANNESİ <span class="Puan-Etiketi Arti-Puan">+50</span>
        </button>
    </div>

    <!-- 50 Puanı Geçince Açılacak Kart -->
    <div id="TebrikKartı" class="Tebrik-Alani">
        🎉 BUGÜN DİNLENMEYİ HAKETTİN ANNEM ❤️
    </div>
</div>

<script>
    let toplamPuan = 0;

    function PuanDegistir(miktar) {
        toplamPuan += miktar;
        document.getElementById('Puan').innerText = toplamPuan;

        // Her tıklandığında %25 şansla nadir butonlardan biri aktifleşebilir
        if(Math.random() < 0.25) {
            document.getElementById('Nadir1').disabled = false;
            document.getElementById('Nadir1').innerHTML = "❤️ SENİ ÇOK SEVİYORUZ ANNEM <span class='Puan-Etiketi Arti-Puan'>+40</span>";
        }
        if(Math.random() < 0.20) {
            document.getElementById('Nadir2').disabled = false;
            document.getElementById('Nadir2').innerHTML = "👑 DÜNYANIN EN İYİ ANNESİ <span class='Puan-Etiketi Arti-Puan'>+50</span>";
        }

        // 50 Puan Kontrolü
        const tebrikKarti = document.getElementById('TebrikKartı');
        if (toplamPuan >= 50) {
            tebrikKarti.style.display = 'block';
        } else {
            tebrikKarti.style.display = 'none';
        }
    </div>
</script>

</body>
</html>
